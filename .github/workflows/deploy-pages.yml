name: Build City Planning Game

on:
  push:
    branches:
      - main
    paths-ignore:
      - site/**
      - deployment-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assemble static website
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cat source/index.html.part* > site/index.html
          cat source/styles.css.part* > site/styles.css
          cat source/app.js.part* > site/app.js
          touch site/.nojekyll
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js

      - name: Record deployment links
        shell: bash
        run: |
          printf '{\n  "status": "success",\n  "primary_url": "https://raw.githack.com/%s/main/site/index.html",\n  "cdn_url": "https://cdn.jsdelivr.net/gh/%s@main/site/index.html",\n  "source_commit": "%s",\n  "built_at": "%s"\n}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > deployment-status.json

      - name: Commit built website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site deployment-status.json
          git commit -m "Build deployable city planning website [skip ci]"
          git push
