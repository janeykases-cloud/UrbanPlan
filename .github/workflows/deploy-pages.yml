name: Deploy City Planning Game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assemble static website
        shell: bash
        run: |
          mkdir -p _site
          cat source/index.html.part* > _site/index.html
          cat source/styles.css.part* > _site/styles.css
          cat source/app.js.part* > _site/app.js
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
